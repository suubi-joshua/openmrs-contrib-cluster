name: Helm Build

on:
  push:
    paths:
      - 'helm/**'
  pull_request:
    paths:
      - 'helm/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.4

      - name: Add Helm Repositories
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add elastic https://helm.elastic.co
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update

      - name: Lint Subcharts
        run: |
          helm lint helm/openmrs-backend
          helm lint helm/openmrs-frontend

      - name: Update Dependencies
        run: helm dependency update helm/openmrs

      - name: Update Tenant Dependencies
        run: helm dependency update helm/openmrs-tenant

      - name: Update Operator Dependencies
        run: helm dependency update helm/openmrs-operator

      - name: Lint Operator Chart
        run: helm lint helm/openmrs-operator

      - name: Lint Main Chart
        run: helm lint helm/openmrs

      - name: Package Chart
        run: helm package helm/openmrs

      - name: Validate Rendering (default values)
        run: |
          helm template helm/openmrs --generate-name > /tmp/default.yaml
          grep -q 'OMRS_DB_URL: "jdbc:mariadb:loadbalance://release-name-mariadb.default.svc.cluster.local:3306/openmrs?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true"' /tmp/default.yaml
          grep -q 'OMRS_DB_NAME: "openmrs"' /tmp/default.yaml
          # Non-autoscaling default keeps its PVC on scale-to-0 - pins the Retain side
          # of the retention ternary so it can't be flattened to a plain Delete.
          grep -q 'whenScaled: Retain' /tmp/default.yaml

      - name: Validate Rendering (full-featured)
        run: |
          helm template helm/openmrs --generate-name \
            --values helm/kind-openmrs.yaml > /tmp/full-featured.yaml
          grep -q 'OMRS_DB_URL: "jdbc:mariadb:loadbalance://release-name-mariadb.default.svc.cluster.local:3306/openmrs?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true"' /tmp/full-featured.yaml
          grep -q 'OMRS_DB_NAME: "openmrs"' /tmp/full-featured.yaml

      - name: Validate Rendering (minimal, no optional features)
        run: |
          helm template helm/openmrs --generate-name \
            --set monitoring.enabled=false \
            --set elasticsearch.enabled=false \
            --set seaweedfs.enabled=false > /tmp/minimal.yaml
          grep -q 'OMRS_DB_URL: "jdbc:mariadb:loadbalance://release-name-mariadb.default.svc.cluster.local:3306/openmrs?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true"' /tmp/minimal.yaml
          grep -q 'OMRS_DB_NAME: "openmrs"' /tmp/minimal.yaml

      - name: Validate Rendering (external database)
        run: |
          helm template helm/openmrs --generate-name \
            --set global.mariadb.enabled=false \
            --set openmrs-backend.db.database=openmrs_rds \
            --set openmrs-backend.db.username=rdsuser > /tmp/external-db.yaml
          grep -q 'OMRS_DB_USERNAME: "rdsuser"' /tmp/external-db.yaml
          grep -q 'OMRS_DB_NAME: "openmrs_rds"' /tmp/external-db.yaml

      - name: Validate Rendering (external database via db.url)
        run: |
          # The db.url path must emit OMRS_DB (driver select) and OMRS_DB_HOSTNAME/PORT
          # (startup wait-for-it) — without them the backend picks the wrong JDBC driver
          # or waits on localhost. Exercised here at the openmrs-backend level, not only
          # via a consumer chart.
          helm template helm/openmrs-backend --generate-name \
            --set global.mariadb.enabled=false \
            --set db.url="jdbc:mariadb:loadbalance://ext-mariadb:3306/openmrs_ext" \
            --set db.hostname=ext-mariadb \
            --set db.username=extuser \
            --set db.password=extpass > /tmp/backend-url.yaml
          grep -q 'OMRS_DB: "mariadb"' /tmp/backend-url.yaml
          grep -q 'OMRS_DB_HOSTNAME: "ext-mariadb"' /tmp/backend-url.yaml
          grep -q 'OMRS_DB_URL: "jdbc:mariadb:loadbalance://ext-mariadb:3306/openmrs_ext"' /tmp/backend-url.yaml
          if err=$(helm template helm/openmrs --generate-name \
              --set global.mariadb.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://ext-mariadb:3306/openmrs_ext 2>&1); then
            echo "expected db.url with no db.hostname to be rejected"; exit 1
          fi
          grep -qF 'db.hostname is required alongside db.url' <<<"$err"

      - name: "Validate Rendering (operator default: metrics-server ON, autoscaler OFF)"
        run: |
          helm dependency update helm/openmrs-operator
          helm template helm/openmrs-operator --generate-name > /tmp/operator-default.yaml
          # Metrics Server on by default, Cluster Autoscaler off.
          grep -q 'app.kubernetes.io/name: metrics-server' /tmp/operator-default.yaml
          if grep -qi 'cluster-autoscaler' /tmp/operator-default.yaml; then
            echo "cluster-autoscaler must be off by default"; exit 1
          fi

      - name: "Validate Rendering (operator: autoscaler ON for AWS + metrics-server OFF)"
        run: |
          # Real release name (not --generate-name): the ServiceAccount name must
          # match what terraform/modules/eks/iam.tf's IRSA trust policy expects.
          helm template openmrs-operator ./helm/openmrs-operator \
            --set clusterAutoscaler.enabled=true \
            --set clusterAutoscaler.cloudProvider=aws \
            --set clusterAutoscaler.awsRegion=us-east-2 \
            --set clusterAutoscaler.autoDiscovery.clusterName=openmrs-cluster-nonprod \
            --set metrics-server.enabled=false > /tmp/operator-aws.yaml
          # Must render the nameOverride-fixed lowercase name (the raw alias name
          # is mixed-case and rejected by the API on a real install).
          if ! grep -q 'openmrs-operator-cluster-autoscaler' /tmp/operator-aws.yaml; then
            echo "cluster-autoscaler subchart must render with the nameOverride-fixed name when enabled"; exit 1
          fi
          grep -q 'openmrs-cluster-nonprod' /tmp/operator-aws.yaml
          # The awsRegion we passed must reach the pod (guards against the chart's
          # us-east-1 default silently taking over - CA would scan the wrong region).
          if ! grep -q 'us-east-2' /tmp/operator-aws.yaml; then
            echo "awsRegion must render onto the CA pod (AWS_REGION), not the chart's us-east-1 default"; exit 1
          fi
          if grep -q 'us-east-1' /tmp/operator-aws.yaml; then
            echo "chart's default AWS_REGION=us-east-1 leaked through"; exit 1
          fi
          if grep -q 'app.kubernetes.io/name: metrics-server' /tmp/operator-aws.yaml; then
            echo "metrics-server must be disableable"; exit 1
          fi

      - name: "Validate Rendering (operator CA guard: rejects enable without a discovery target)"
        run: |
          # CA enabled with a cloudProvider but no autoDiscovery.clusterName must
          # fail the render. The upstream CA Deployment gates on autoDiscovery/
          # autoscalingGroups (not cloudProvider), so this combo would otherwise
          # create RBAC + the IRSA ServiceAccount but no autoscaler pod - a silent
          # no-op. The guard (helm/openmrs-operator/templates/validate.yaml) blocks it.
          if err=$(helm template openmrs-operator ./helm/openmrs-operator \
              --set clusterAutoscaler.enabled=true \
              --set clusterAutoscaler.cloudProvider=aws \
              --set clusterAutoscaler.awsRegion=us-east-2 2>&1); then
            echo "expected render to fail: CA enabled with a provider but no autoDiscovery target"; exit 1
          fi
          grep -qF 'requires BOTH' <<<"$err"

      - name: "Validate Rendering (operator CA guard: rejects aws without awsRegion)"
        run: |
          # cloudProvider=aws without awsRegion must fail: the upstream chart
          # otherwise pins AWS_REGION=us-east-1 on the CA pod and it scans the wrong
          # region - a silent no-op. The guard requires an explicit region on AWS.
          if err=$(helm template openmrs-operator ./helm/openmrs-operator \
              --set clusterAutoscaler.enabled=true \
              --set clusterAutoscaler.cloudProvider=aws \
              --set clusterAutoscaler.autoDiscovery.clusterName=openmrs-cluster-nonprod 2>&1); then
            echo "expected render to fail: CA on aws without awsRegion"; exit 1
          fi
          grep -qF 'requires clusterAutoscaler.awsRegion' <<<"$err"

      - name: "Validate Rendering (operator CA guard: aws rejects clusterapi-only discovery fields)"
        run: |
          # autoDiscovery.namespace/labels satisfy the upstream render gate but only
          # reach the CA container on cloudProvider=clusterapi; on aws they yield a pod
          # with no --node-group argument (a silent no-op). The guard must reject them
          # on aws, while still accepting them on clusterapi.
          if err=$(helm template openmrs-operator ./helm/openmrs-operator \
              --set clusterAutoscaler.enabled=true \
              --set clusterAutoscaler.cloudProvider=aws \
              --set clusterAutoscaler.awsRegion=us-east-2 \
              --set clusterAutoscaler.autoDiscovery.namespace=kube-system 2>&1); then
            echo "expected render to fail: aws with only a clusterapi-scoped discovery field"; exit 1
          fi
          grep -qF 'requires BOTH' <<<"$err"

      - name: "Validate Rendering (operator CA guard: rejects a discovery target the provider does not read)"
        run: |
          # autoDiscovery.clusterName is only read by aws/azure/magnum/clusterapi. On gce
          # (and hetzner/oci) the pod comes up with no node-group argument, so clusterName
          # alone must not satisfy the guard there; autoscalingGroups is the universal one.
          if err=$(helm template openmrs-operator ./helm/openmrs-operator \
              --set clusterAutoscaler.enabled=true \
              --set clusterAutoscaler.cloudProvider=gce \
              --set clusterAutoscaler.autoDiscovery.clusterName=openmrs-cluster-nonprod 2>&1); then
            echo "expected render to fail: gce with only clusterName (gce does not read it)"; exit 1
          fi
          grep -qF 'requires BOTH' <<<"$err"

      - name: "Validate Rendering (backend: all-digit seaweedfs bucket stays a string)"
        run: |
          # ConfigMap.data must be map[string]string; an all-digit bucket name would
          # render as a YAML integer and be rejected by the API server without | quote.
          helm template helm/openmrs-backend --generate-name \
            --set seaweedfs.enabled=true --set seaweedfs.s3.bucketName=12345 \
            | grep -q 'storage.s3.bucketName: "12345"'

      - name: "Validate Rendering (backend autoscaling: HPA StatefulSet + sticky route)"
        run: |
          # Multi-replica needs clustered cache + shared storage (enforced by the guard).
          helm template helm/openmrs-backend --generate-name \
            --set autoscaling.enabled=true \
            --set infinispan.clustered=true \
            --set seaweedfs.enabled=true > /tmp/backend-autoscaling.yaml
          # HPA targets the StatefulSet (not a Deployment).
          grep -A4 'scaleTargetRef' /tmp/backend-autoscaling.yaml | grep -q 'kind: StatefulSet'
          # Sticky routing engages under autoscaling: the HTTPRoute must route THROUGH
          # the sticky TraefikService (checking the backendRef, not just that the
          # TraefikService resource exists). gateway.enabled already defaults to true.
          grep -A4 'backendRefs' /tmp/backend-autoscaling.yaml | grep -q 'kind: TraefikService'
          # PDB renders whenever the backend can scale above 1, using maxUnavailable
          # so a single-replica backend stays drainable (node maintenance / CA scale-in).
          grep -q 'kind: PodDisruptionBudget' /tmp/backend-autoscaling.yaml
          grep -q 'maxUnavailable:' /tmp/backend-autoscaling.yaml
          # Under autoscaling the PVC retention flips to Delete (scale-in drops the claim).
          grep -q 'whenScaled: Delete' /tmp/backend-autoscaling.yaml

      - name: "Validate Rendering (backend autoscaling guard: rejects multi-replica without shared state)"
        run: |
          # Autoscaling without clustered cache + shared storage must fail the render.
          if err=$(helm template helm/openmrs-backend --generate-name \
              --set autoscaling.enabled=true 2>&1); then
            echo "expected render to fail without infinispan.clustered + seaweedfs.enabled"; exit 1
          fi
          grep -qF 'running multiple replicas' <<<"$err"

      - name: Validate Rendering (MariaDB replication mode)
        run: |
          helm template helm/openmrs --generate-name \
            --set global.mariadb.galera=false \
            --set global.mariadb.replicas=2 > /tmp/replication.yaml
          grep -q 'replication:' /tmp/replication.yaml
          grep -q 'OMRS_DB_URL: "jdbc:mariadb:replication://release-name-mariadb-primary.default.svc.cluster.local:3306,release-name-mariadb-secondary.default.svc.cluster.local:3306/openmrs?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true"' /tmp/replication.yaml

      - name: Validate 1.x values are rejected
        run: |
          fail_if_renders() {
            if helm template helm/openmrs --generate-name --set "$1" >/dev/null 2>&1; then
              echo "expected the 2.0.0 guard to reject $1"
              exit 1
            fi
          }
          fail_if_renders openmrs-backend.monitoring.enabled=true
          fail_if_renders openmrs-backend.mariadb.auth.password=x
          fail_if_renders openmrs-backend.elasticsearch.enabled=true
          fail_if_renders openmrs-backend.seaweedfs.enabled=true
          fail_if_renders openmrs-backend.seaweedfs.master.replicas=7
          fail_if_renders openmrs-backend.seaweedfs.volume.replicas=7
          fail_if_renders openmrs-backend.seaweedfs.filer.replicas=7
          fail_if_renders openmrs-backend.seaweedfs.s3.enabled=true
          fail_if_renders openmrs-backend.seaweedfs.s3.replicas=99
          fail_if_renders openmrs-backend.seaweedfs.s3.enableAuth=true
          fail_if_renders openmrs-backend.seaweedfs.admin.ingress.enabled=true
          fail_if_renders openmrs-backend.seaweedfs.admin.enabled=true

      - name: Lint and Render Tenant Chart
        run: |
          TENANT_VALUES="--set global.tenant.name=tenant1 \
            --set openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/openmrs_tenant1?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true \
            --set openmrs-backend.db.hostname=mariadb.example.svc.cluster.local \
            --set openmrs-backend.db.username=openmrs_tenant1_user \
            --set openmrs-backend.db.password=ci-pass"
          helm lint helm/openmrs-tenant $TENANT_VALUES
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES > /tmp/tenant.yaml
          grep -q 'name: tenant1-openmrs-backend' /tmp/tenant.yaml
          grep -q 'name: tenant1-openmrs-frontend' /tmp/tenant.yaml
          grep -q 'OMRS_DB_URL: "jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/openmrs_tenant1?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true"' /tmp/tenant.yaml
          grep -q 'OMRS_DB_HOSTNAME: "mariadb.example.svc.cluster.local"' /tmp/tenant.yaml
          grep -q 'SPA_PATH: "/openmrs/spa"' /tmp/tenant.yaml
          # Backend and frontend pod templates (at least) carry the tenant label.
          [ "$(grep -c 'app.kubernetes.io/tenant: "tenant1"' /tmp/tenant.yaml)" -ge 6 ]
          if grep -q 'storageClassName: ""' /tmp/tenant.yaml; then
            echo "empty storageClassName means no-class (PVC stays Pending); it must be omitted"; exit 1
          fi
          # Default render: HTTPRoutes stay off (gateway.enabled=false by default
          # in the tenant chart, so hostless routes would collide on the shared gateway).
          if grep -q 'kind: HTTPRoute' /tmp/tenant.yaml; then
            echo "expected NO HTTPRoutes in the default tenant render (gateway must stay off by default)"; exit 1
          fi
          # operator Database/User/Grant CRs + credential Secret render,
          # DB defaults to openmrs_<tenant>.
          grep -q 'kind: Database' /tmp/tenant.yaml
          grep -q 'kind: User' /tmp/tenant.yaml
          grep -q 'kind: Grant' /tmp/tenant.yaml
          grep -q 'name: tenant1-db-credentials' /tmp/tenant.yaml
          grep -q 'k8s.mariadb.com/watch: ""' /tmp/tenant.yaml
          grep -q 'mariaDbRef:' /tmp/tenant.yaml
          grep -q 'name: "openmrs-mariadb"' /tmp/tenant.yaml
          grep -q 'namespace: "openmrs"' /tmp/tenant.yaml
          grep -q 'name: "openmrs_tenant1"' /tmp/tenant.yaml
          grep -q 'maxUserConnections: 20' /tmp/tenant.yaml
          [ "$(grep -c 'cleanupPolicy: "Skip"' /tmp/tenant.yaml)" -eq 3 ]
          grep -q 'characterSet: utf8mb4' /tmp/tenant.yaml
          grep -q 'collate: utf8mb4_general_ci' /tmp/tenant.yaml
          # Hyphenated tenants normalize to '_' in the DB name (JDBC URL convention).
          helm template east-coast helm/openmrs-tenant \
            --set global.tenant.name=east-coast \
            --set openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example:3306/openmrs_east_coast \
            --set openmrs-backend.db.hostname=mariadb.example \
            --set openmrs-backend.db.username=openmrs_east_coast_user \
            --set openmrs-backend.db.password=ec-pass > /tmp/tenant-hyphen.yaml
          grep -q 'name: "openmrs_east_coast"' /tmp/tenant-hyphen.yaml
          # Grant database must escape _ (SQL LIKE wildcard) to prevent cross-tenant access.
          # The YAML file contains double backslashes (\\_) because | quote escapes \.
          grep -q 'database: "openmrs\\\\_east\\\\_coast"' /tmp/tenant-hyphen.yaml
          # All-digit tenant name: toString prevents int64 render errors.
          helm template num1 helm/openmrs-tenant $TENANT_VALUES \
            --set global.tenant.name=12345 \
            --set openmrs-backend.db.username=openmrs_12345_user \
            --set openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example:3306/openmrs_12345 > /tmp/tenant-digit.yaml
          grep -q 'name: "openmrs_12345"' /tmp/tenant-digit.yaml
          grep -q 'app.kubernetes.io/tenant: "12345"' /tmp/tenant-digit.yaml
          # dbBootstrap.database override: custom name must appear in CRs and match the URL.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set dbBootstrap.database=openmrs_tenant1_custom \
            --set "openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/openmrs_tenant1_custom?autoReconnect=true" > /tmp/tenant-override.yaml
          grep -q 'name: "openmrs_tenant1_custom"' /tmp/tenant-override.yaml
          # Drift guard: override must still match the URL's database.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set dbBootstrap.database=openmrs_tenant1_custom 2>&1); then
            echo "expected the guard to reject a dbBootstrap.database override that differs from the URL's database"; exit 1
          fi
          grep -qF 'openmrs-tenant: openmrs-backend.db.url must target the same database' <<<"$err"
          # A '/' inside the JDBC properties must not be read as the database segment.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set "openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/openmrs_tenant1?useSsl=true&serverSslCert=/etc/ssl/certs/mariadb-ca.pem" > /dev/null
          # Without these the backend silently falls back to the primary DB defaults.
          if err=$(helm template tenant1 helm/openmrs-tenant --set global.tenant.name=tenant1 2>&1); then
            echo "expected the db guard to reject a tenant with no database configured"; exit 1
          fi
          grep -qF 'openmrs-tenant: openmrs-backend.db.url' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant --set openmrs-backend.db.url=jdbc:x --set openmrs-backend.db.hostname=h --set openmrs-backend.db.username=u --set openmrs-backend.db.password=p 2>&1); then
            echo "expected the guard to reject a tenant with no global.tenant.name"; exit 1
          fi
          grep -qF 'openmrs-tenant: global.tenant.name is required' <<<"$err"
          # Tenant name must not contain _ — both - and _ normalize to _, so
          # east-coast and east_coast would collide on the same MariaDB account.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set global.tenant.name=east_coast 2>&1); then
            echo "expected the guard to reject a tenant name containing underscores"; exit 1
          fi
          grep -qF 'global.tenant.name must not contain underscores' <<<"$err"
          # Same collision via s3Bootstrap with dbBootstrap off (both - and _ normalize to _ in
          # the SeaweedFS identity), so the guard must fire there too; and a valid hyphen name
          # renders the bootstrap Job with the 240s deadline default.
          S3T="--set dbBootstrap.enabled=false \
            --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_east_coast \
            --set openmrs-backend.db.hostname=h \
            --set openmrs-backend.db.username=u --set openmrs-backend.db.password=p \
            --set openmrs-backend.seaweedfs.enabled=true \
            --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
            --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-east-coast \
            --set-string openmrs-backend.seaweedfs.s3.credentials.accessKey=east-coast-key \
            --set-string openmrs-backend.seaweedfs.s3.credentials.secretKey=ec-secret \
            --set s3Bootstrap.enabled=true"
          if err=$(helm template t helm/openmrs-tenant --set global.tenant.name=east_coast $S3T 2>&1); then
            echo "underscore guard must fire under s3Bootstrap with dbBootstrap off"; exit 1
          fi
          grep -qF 'global.tenant.name must not contain underscores' <<<"$err"
          helm template t helm/openmrs-tenant --set global.tenant.name=east-coast $S3T > /tmp/tenant-s3b.yaml
          grep -qE 'activeDeadlineSeconds: 240' /tmp/tenant-s3b.yaml
          # s3Bootstrap mints a real Read/Write/List grant on bucketName, and SeaweedFS keys
          # identities by name only, so both provisioned identifiers must carry the tenant name.
          # The valid-shape checks above alone let a tenant claim the primary's bucket or key.
          if err=$(helm template t helm/openmrs-tenant --set global.tenant.name=east-coast $S3T \
              --set openmrs-backend.seaweedfs.s3.bucketName=openmrs 2>&1); then
            echo "expected the tenant-scoping guard to reject a bucket that lacks the tenant name"; exit 1
          fi
          grep -qF 's3.bucketName (openmrs) must be exactly' <<<"$err"
          if err=$(helm template t helm/openmrs-tenant --set global.tenant.name=east-coast $S3T \
              --set-string openmrs-backend.seaweedfs.s3.credentials.accessKey=ec-key 2>&1); then
            echo "expected the tenant-scoping guard to reject an accessKey that lacks the tenant name"; exit 1
          fi
          grep -qF 's3.credentials.accessKey must contain the tenant name' <<<"$err"
          # Tenant-scoping guard: username must be exactly openmrs_<tenant>_user.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set openmrs-backend.db.username=openmrs 2>&1); then
            echo "expected the guard to reject a username that is not exactly openmrs_<tenant>_user"; exit 1
          fi
          grep -qF 'openmrs-backend.db.username' <<<"$err"
          # A tenant whose name is a prefix of another's must not reach that tenant's account.
          if err=$(helm template east helm/openmrs-tenant \
              --set global.tenant.name=east \
              --set openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example:3306/openmrs_east \
              --set openmrs-backend.db.hostname=mariadb.example \
              --set openmrs-backend.db.username=openmrs_east_coast_user \
              --set openmrs-backend.db.password=ec-pass 2>&1); then
            echo "expected the guard to reject another tenant's user"; exit 1
          fi
          grep -qF 'must be exactly openmrs_east_user' <<<"$err"
          # Tenant-scoping guard: database must contain the tenant name. The URL
          # agrees with the override here, so only the tenant-scoping guard can
          # be what rejects it.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set dbBootstrap.database=openmrs \
              --set "openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/openmrs?autoReconnect=true" 2>&1); then
            echo "expected the guard to reject a database name that does not contain the tenant name"; exit 1
          fi
          grep -qF 'dbBootstrap.database (openmrs) must contain the tenant name' <<<"$err"
          # dbBootstrap disabled → no CRs/Secret leak.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set dbBootstrap.enabled=false > /tmp/tenant-manual.yaml
          if grep -q 'db-bootstrap' /tmp/tenant-manual.yaml; then
            echo "expected NO dbBootstrap resources when disabled"; exit 1
          fi
          # No imperative bootstrap: no Job, no rootPassword, no SQL or bash
          # interpolation reaching the database.
          if grep -qE 'kind: Job|IDENTIFIED BY|CREATE DATABASE|rootPassword|db-bootstrap-job' /tmp/tenant.yaml; then
            echo "expected NO imperative bootstrap (Job/SQL/rootPassword) in the operator-CRD render"; exit 1
          fi
          # Operator CWE-89 (26.6.0): ' and \ in CR-built SQL fields fail render loudly.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set "openmrs-backend.db.password=O'Brien\$(id)" 2>&1); then
            echo "expected the dbBootstrap guard to reject a password with a single quote"; exit 1
          fi
          grep -qF 'openmrs-backend.db.password must not contain single quotes or backslashes' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set 'openmrs-backend.db.password=C:\\windows' 2>&1); then
            echo "expected the dbBootstrap guard to reject a password with a backslash"; exit 1
          fi
          grep -qF 'openmrs-backend.db.password must not contain single quotes or backslashes' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set "openmrs-backend.db.username=openmrs_tenant1_user'" 2>&1); then
            echo "expected the dbBootstrap guard to reject a username with a single quote"; exit 1
          fi
          grep -qF 'openmrs-backend.db.username must not contain single quotes or backslashes' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set 'openmrs-backend.db.username=openmrs_tenant1\\user' 2>&1); then
            echo "expected the dbBootstrap guard to reject a username with a backslash"; exit 1
          fi
          grep -qF 'openmrs-backend.db.username must not contain single quotes or backslashes' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set "dbBootstrap.database=openmrs_tenant1't" 2>&1); then
            echo "expected the guard to reject a database name with a single quote"; exit 1
          fi
          grep -qF 'single quotes, backslashes or backticks' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set "dbBootstrap.database=openmrs_tenant1\`db" 2>&1); then
            echo "expected the dbBootstrap guard to reject a database name with a backtick"; exit 1
          fi
          grep -qF 'single quotes, backslashes or backticks' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set 'dbBootstrap.database=openmrs_tenant1\\db' 2>&1); then
            echo "expected the guard to reject a database name with a backslash"; exit 1
          fi
          grep -qF 'single quotes, backslashes or backticks' <<<"$err"
          # The URL's database segment must match the provisioned database — they are the same DB.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set "openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/other_db?autoReconnect=true" 2>&1); then
            echo "expected the guard to reject a db.url whose database differs from dbBootstrap's"; exit 1
          fi
          grep -qF 'openmrs-tenant: openmrs-backend.db.url must target the same database' <<<"$err"
          # Shell metachars without ' or \ still render.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set 'openmrs-backend.db.password=O$Brien$(id)' > /tmp/tenant-inject.yaml
          grep -qF 'password: "O$Brien$(id)"' /tmp/tenant-inject.yaml
          if grep -qE 'IDENTIFIED BY|CREATE DATABASE|DB_PASS=|mariadb -u' /tmp/tenant-inject.yaml; then
            echo "expected no shell/SQL interpolation surface in the operator-CRD render"; exit 1
          fi
          # All-digit password: quote handles int64 without toString.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set 'openmrs-backend.db.password=12345' > /tmp/tenant-digit-pw.yaml
          grep -qF 'password: "12345"' /tmp/tenant-digit-pw.yaml
          # Forward check: when routing IS enabled, the per-tenant spaPath still
          # reaches the route match and the redirect target, not just the ConfigMap.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set openmrs-backend.gateway.enabled=true \
            --set "openmrs-backend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.gateway.enabled=true \
            --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.spaPath=/tenant-a/spa \
            --set openmrs-frontend.rootRedirect.enabled=true > /tmp/tenant-routing.yaml
          grep -q 'SPA_PATH: "/tenant-a/spa"' /tmp/tenant-routing.yaml
          grep -q 'value: /tenant-a/spa' /tmp/tenant-routing.yaml
          grep -q 'replaceFullPath: /tenant-a/spa/home' /tmp/tenant-routing.yaml
          grep -q 'tenant1.example.com' /tmp/tenant-routing.yaml
          grep -q 'kind: HTTPRoute' /tmp/tenant-routing.yaml
          # Clustered infinispan still renders
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set openmrs-backend.infinispan.clustered=true > /dev/null

      - name: Validate routing guard (enabled without hostnames rejected)
        run: |
          TENANT_VALUES="--set global.tenant.name=tenant1 \
            --set openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/openmrs_tenant1?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true \
            --set openmrs-backend.db.hostname=mariadb.example.svc.cluster.local \
            --set openmrs-backend.db.username=openmrs_tenant1_user \
            --set openmrs-backend.db.password=ci-pass"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set openmrs-backend.gateway.enabled=true 2>&1); then
            echo "expected the routing guard to reject backend gateway.enabled without hostnames"; exit 1
          fi
          grep -qF 'openmrs-backend.gateway.hostnames' <<<"$err"
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set openmrs-frontend.gateway.enabled=true 2>&1); then
            echo "expected the routing guard to reject frontend gateway.enabled without hostnames"; exit 1
          fi
          grep -qF 'openmrs-frontend.gateway.hostnames' <<<"$err"
          # Frontend-only with default relative apiUrl must be rejected — the SPA
          # would hit the primary backend's catch-all route.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set openmrs-frontend.gateway.enabled=true \
              --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" 2>&1); then
            echo "expected the guard to reject frontend-only routing with relative apiUrl"; exit 1
          fi
          grep -qF 'openmrs-backend.gateway does not route it' <<<"$err"
          # Empty apiUrl is also relative (no scheme), must be rejected.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set openmrs-frontend.gateway.enabled=true \
              --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" \
              --set openmrs-frontend.apiUrl="" 2>&1); then
            echo "expected the guard to reject empty apiUrl with frontend routing"; exit 1
          fi
          grep -qF 'openmrs-backend.gateway does not route it' <<<"$err"
          # Dot-relative apiUrl must be rejected.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set openmrs-frontend.gateway.enabled=true \
              --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" \
              --set openmrs-frontend.apiUrl=./openmrs 2>&1); then
            echo "expected the guard to reject dot-relative apiUrl with frontend routing"; exit 1
          fi
          grep -qF 'openmrs-backend.gateway does not route it' <<<"$err"
          # Mismatched hostnames: frontend on cosat.example.com, backend on coast.example.com.
          if err=$(helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
              --set openmrs-backend.gateway.enabled=true \
              --set "openmrs-backend.gateway.hostnames[0]=coast.example.com" \
              --set openmrs-frontend.gateway.enabled=true \
              --set "openmrs-frontend.gateway.hostnames[0]=cosat.example.com" 2>&1); then
            echo "expected the guard to reject mismatched hostnames"; exit 1
          fi
          grep -qF 'cosat.example.com serves the tenant SPA' <<<"$err"
          # Backend-only (API-only tenant) must still render.
          # NOTE: on this host, /openmrs/spa falls through to the primary's catch-all
          # route — Traefik's priority math gives the hostless route precedence over
          # the tenant's backend-only route for the SPA path. This is expected: an
          # API-only tenant has no frontend to serve.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set openmrs-backend.gateway.enabled=true \
            --set "openmrs-backend.gateway.hostnames[0]=tenant1.example.com" > /dev/null
          # Frontend with absolute apiUrl must bypass the hostname check.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set openmrs-backend.gateway.enabled=true \
            --set "openmrs-backend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.gateway.enabled=true \
            --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.apiUrl=https://api.example.com > /dev/null
          # Host-absolute apiUrl (//api.example.com) must also bypass the check.
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set openmrs-backend.gateway.enabled=true \
            --set "openmrs-backend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.gateway.enabled=true \
            --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.apiUrl=//api.example.com > /dev/null

      - name: Validate primary render unchanged (no hostnames on routes)
        run: |
          helm template helm/openmrs --generate-name \
            --set monitoring.enabled=false \
            --set elasticsearch.enabled=false \
            --set seaweedfs.enabled=false > /tmp/primary.yaml
          grep -q 'kind: HTTPRoute' /tmp/primary.yaml
          if grep -q 'coast.example.com\|nyanza.example.com' /tmp/primary.yaml; then
            echo "primary render must not contain tenant hostnames"; exit 1
          fi
          # The primary backend/frontend routes must stay hostless (catch-all).
          # The root-redirect route legitimately carries a hostname, so scope this
          # to the two catch-all templates rather than the whole render.
          # Capture output first so a helm error (e.g. renamed template) fails
          # the step under bash -e instead of silently passing via grep on empty.
          out=$(helm template helm/openmrs --generate-name \
              --set monitoring.enabled=false \
              --set elasticsearch.enabled=false \
              --set seaweedfs.enabled=false \
              --show-only charts/openmrs-backend/templates/httproute.yaml \
              --show-only charts/openmrs-frontend/templates/httproute.yaml)
          if grep -q 'hostnames:' <<<"$out"; then
            echo "primary HTTPRoutes must not have hostnames (catch-all)"; exit 1
          fi

      - name: Validate root-redirect hostname fallback and merge
        run: |
          TENANT_VALUES="--set global.tenant.name=tenant1 \
            --set openmrs-backend.db.url=jdbc:mariadb:loadbalance://mariadb.example.svc.cluster.local:3306/openmrs_tenant1?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true \
            --set openmrs-backend.db.hostname=mariadb.example.svc.cluster.local \
            --set openmrs-backend.db.username=openmrs_tenant1_user \
            --set openmrs-backend.db.password=ci-pass"
          # Case 1: rootRedirect.hostnames empty, gateway.hostnames set → fallback
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set openmrs-backend.gateway.enabled=true \
            --set "openmrs-backend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.gateway.enabled=true \
            --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.rootRedirect.enabled=true > /tmp/tenant-fallback.yaml
          # root-redirect-httproute should inherit gateway.hostnames
          grep -A20 'root-redirect' /tmp/tenant-fallback.yaml | grep -q 'tenant1.example.com'
          # ...and nothing else: if the shared frontend chart ever defaults
          # rootRedirect.hostnames back to [localhost], every tenant's route would
          # claim localhost too and the check above would still pass.
          if grep -A20 'root-redirect' /tmp/tenant-fallback.yaml | grep -q 'localhost'; then
            echo "tenant root-redirect must not inherit a localhost default from the shared chart"; exit 1
          fi
          # Case 2: both rootRedirect.hostnames and gateway.hostnames set → merge (dedup)
          helm template tenant1 helm/openmrs-tenant $TENANT_VALUES \
            --set openmrs-backend.gateway.enabled=true \
            --set "openmrs-backend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.gateway.enabled=true \
            --set "openmrs-frontend.gateway.hostnames[0]=tenant1.example.com" \
            --set openmrs-frontend.rootRedirect.enabled=true \
            --set "openmrs-frontend.rootRedirect.hostnames[0]=root.example.com" > /tmp/tenant-merge.yaml
          # root-redirect should have both hostnames (deduplicated)
          grep -A20 'root-redirect' /tmp/tenant-merge.yaml | grep -q 'root.example.com'
          grep -A20 'root-redirect' /tmp/tenant-merge.yaml | grep -q 'tenant1.example.com'
          # Case 3: NOTES.txt uses actual spaPath, not hardcoded /openmrs/spa
          # helm template does not render NOTES.txt; verify the template directly.
          grep -q '{{ index $.Values "openmrs-frontend" "spaPath" }}/home' helm/openmrs-tenant/templates/NOTES.txt
          if grep -q '/openmrs/spa/home' helm/openmrs-tenant/templates/NOTES.txt; then
            echo "NOTES.txt must not hardcode /openmrs/spa when spaPath is used"; exit 1
          fi

      - name: Validate tenant scaling (sticky cookie, HPAs, s3-bootstrap, storage swap)
        run: |
          SCALE="--set global.tenant.name=demo \
            --set dbBootstrap.enabled=false \
            --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
            --set openmrs-backend.db.hostname=h \
            --set openmrs-backend.db.username=openmrs_demo_user \
            --set openmrs-backend.db.password=ci-pass \
            --set openmrs-backend.replicaCount=3 \
            --set openmrs-backend.infinispan.clustered=true \
            --set openmrs-backend.autoscaling.enabled=true \
            --set openmrs-frontend.autoscaling.enabled=true \
            --set openmrs-backend.seaweedfs.enabled=true \
            --set openmrs-backend.seaweedfs.s3.endpoint=http://openmrs-seaweedfs-s3.openmrs.svc.cluster.local:8333 \
            --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
            --set openmrs-backend.seaweedfs.s3.credentials.accessKey=demoAK \
            --set openmrs-backend.seaweedfs.s3.credentials.secretKey=demoSK \
            --set s3Bootstrap.enabled=true \
            --set openmrs-backend.traefikService.sticky.cookie.name=openmrs_session_demo"
          helm template demo helm/openmrs-tenant $SCALE > /tmp/tenant-scale.yaml
          # Per-tenant sticky cookie (unique to the TraefikService)
          grep -q 'name: openmrs_session_demo' /tmp/tenant-scale.yaml
          # Backend + frontend both get an HPA
          [ "$(grep -c 'kind: HorizontalPodAutoscaler' /tmp/tenant-scale.yaml)" = "2" ]
          # s3-bootstrap Job + its scoped-credential Secret render, tenant bucket wired
          grep -q 'name: demo-s3-bootstrap' /tmp/tenant-scale.yaml
          # Pin the tenant grant too: bucket-scoped, never Admin (name-only grep is blind to it).
          grep -q '\-actions Read:%s,Write:%s,List:%s' /tmp/tenant-scale.yaml
          if grep -q '\-actions Admin' /tmp/tenant-scale.yaml; then
            echo "the tenant s3-bootstrap identity must be bucket-scoped, not Admin"; exit 1
          fi
          grep -q 'name: demo-s3-credentials' /tmp/tenant-scale.yaml
          grep -q 'storage.s3.bucketName: "openmrs-demo"' /tmp/tenant-scale.yaml
          # Sticky cookie is Secure by default (production serves over HTTPS)
          grep -q 'secure: true' /tmp/tenant-scale.yaml
          # Clustered backend gets a short JVM DNS TTL for fast JGroups re-discovery
          grep -q 'sun.net.inetaddr.ttl' /tmp/tenant-scale.yaml
          # Backend store is swappable to managed S3 (forcePathStyle false + real region)
          helm template t helm/openmrs-backend \
            --set seaweedfs.enabled=true \
            --set seaweedfs.s3.forcePathStyle=false \
            --set seaweedfs.s3.region=eu-west-1 > /tmp/be-s3.yaml
          grep -q 'storage.s3.forcePathStyle: "false"' /tmp/be-s3.yaml
          grep -q 'storage.s3.region: "eu-west-1"' /tmp/be-s3.yaml
          # An unset forcePathStyle must still come out path-style ("<nil>" would not) - guards
          # the kindIs "invalid" branch against a regression to `| default "true"`.
          helm template t helm/openmrs-backend --set seaweedfs.enabled=true \
            --set seaweedfs.s3.forcePathStyle=null | grep -q 'storage.s3.forcePathStyle: "true"'
          # Storage guard: seaweedfs.enabled without an endpoint is rejected
          if err=$(helm template demo helm/openmrs-tenant \
              --set global.tenant.name=demo --set dbBootstrap.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
              --set openmrs-backend.db.hostname=h \
              --set openmrs-backend.db.username=openmrs_demo_user \
              --set openmrs-backend.db.password=ci-pass \
              --set openmrs-backend.seaweedfs.enabled=true 2>&1); then
            echo "expected the guard to reject seaweedfs.enabled without an endpoint"; exit 1
          fi
          grep -qF 'requires openmrs-backend.seaweedfs.s3.endpoint' <<<"$err"
          # Bucket-name guard: an underscore bucket (openmrs_<tenant>) is not a valid S3
          # name and must be rejected at render time (use openmrs-<tenant>).
          if err=$(helm template demo helm/openmrs-tenant \
              --set global.tenant.name=demo --set dbBootstrap.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
              --set openmrs-backend.db.hostname=h \
              --set openmrs-backend.db.username=openmrs_demo_user \
              --set openmrs-backend.db.password=ci-pass \
              --set openmrs-backend.replicaCount=3 \
              --set openmrs-backend.infinispan.clustered=true \
              --set openmrs-backend.seaweedfs.enabled=true \
              --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
              --set openmrs-backend.seaweedfs.s3.bucketName=openmrs_demo 2>&1); then
            echo "expected the guard to reject an underscore bucket name"; exit 1
          fi
          grep -qF 'not a valid S3 bucket name' <<<"$err"
          # Credential guard: seaweedfs.enabled with a bucket + endpoint but no scoped key
          # must be rejected - otherwise the backend Secret falls back to the shared
          # credentials.admin.* instead of a key scoped to this tenant's bucket.
          if err=$(helm template demo helm/openmrs-tenant \
              --set global.tenant.name=demo --set dbBootstrap.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
              --set openmrs-backend.db.hostname=h \
              --set openmrs-backend.db.username=openmrs_demo_user \
              --set openmrs-backend.db.password=ci-pass \
              --set openmrs-backend.seaweedfs.enabled=true \
              --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
              --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo 2>&1); then
            echo "expected the guard to reject seaweedfs.enabled without a scoped key"; exit 1
          fi
          grep -qF 'falls back to the shared credentials.admin.*' <<<"$err"
          # Injection guard fires only when s3Bootstrap provisions via weed shell: whitespace /
          # leading '-' in a key must be rejected there; a mid-string hyphen (demo-key) stays valid.
          if helm template demo helm/openmrs-tenant \
              --set global.tenant.name=demo --set dbBootstrap.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
              --set openmrs-backend.db.hostname=h \
              --set openmrs-backend.db.username=openmrs_demo_user --set openmrs-backend.db.password=ci-pass \
              --set openmrs-backend.seaweedfs.enabled=true --set s3Bootstrap.enabled=true \
              --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
              --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
              --set-string 'openmrs-backend.seaweedfs.s3.credentials.accessKey=bad key' \
              --set-string openmrs-backend.seaweedfs.s3.credentials.secretKey=demo-secret >/dev/null 2>&1; then
            echo "tenant accessKey with whitespace must be rejected"; exit 1
          fi
          if err=$(helm template demo helm/openmrs-tenant \
              --set global.tenant.name=demo --set dbBootstrap.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
              --set openmrs-backend.db.hostname=h \
              --set openmrs-backend.db.username=openmrs_demo_user --set openmrs-backend.db.password=ci-pass \
              --set openmrs-backend.seaweedfs.enabled=true --set s3Bootstrap.enabled=true \
              --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
              --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
              --set-string openmrs-backend.seaweedfs.s3.credentials.accessKey=demo-key \
              --set-string openmrs-backend.seaweedfs.s3.credentials.secretKey=-actions 2>&1); then
            echo "tenant secretKey with a leading dash must be rejected"; exit 1
          fi
          grep -qF 'must not start with' <<<"$err"
          helm template demo helm/openmrs-tenant \
            --set global.tenant.name=demo --set dbBootstrap.enabled=false \
            --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
            --set openmrs-backend.db.hostname=h \
            --set openmrs-backend.db.username=openmrs_demo_user --set openmrs-backend.db.password=ci-pass \
            --set openmrs-backend.seaweedfs.enabled=true --set s3Bootstrap.enabled=true \
            --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
            --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
            --set-string openmrs-backend.seaweedfs.s3.credentials.accessKey=demo-key \
            --set-string openmrs-backend.seaweedfs.s3.credentials.secretKey=demo-secret >/dev/null
          # Managed S3 (no s3Bootstrap, no weed shell): a special-char secret key must NOT be
          # rejected - those keys only land in a Secret and MinIO/Wasabi allow arbitrary chars.
          helm template demo helm/openmrs-tenant \
            --set global.tenant.name=demo --set dbBootstrap.enabled=false \
            --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
            --set openmrs-backend.db.hostname=h \
            --set openmrs-backend.db.username=openmrs_demo_user --set openmrs-backend.db.password=ci-pass \
            --set openmrs-backend.seaweedfs.enabled=true --set s3Bootstrap.enabled=false \
            --set openmrs-backend.seaweedfs.s3.endpoint=https://s3.wasabisys.com \
            --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
            --set-string 'openmrs-backend.seaweedfs.s3.credentials.accessKey=AKIAEXAMPLE' \
            --set-string 'openmrs-backend.seaweedfs.s3.credentials.secretKey=Sp!S/kr3t+val' >/dev/null
          # IRSA opt-out renders (no guard) and emits NO static S3 keys (default chain).
          helm template demo helm/openmrs-tenant \
            --set global.tenant.name=demo --set dbBootstrap.enabled=false \
            --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
            --set openmrs-backend.db.hostname=h \
            --set openmrs-backend.db.username=openmrs_demo_user --set openmrs-backend.db.password=ci-pass \
            --set openmrs-backend.seaweedfs.enabled=true \
            --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
            --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
            --set openmrs-backend.seaweedfs.s3.credentials.useDefaultChain=true > /tmp/tenant-irsa.yaml
          if grep -q 'storage.s3.accessKeyId' /tmp/tenant-irsa.yaml; then
            echo "IRSA opt-out tenant must emit no static S3 keys"; exit 1
          fi
          # useDefaultChain must only be waived by an explicit true: the string "false" must
          # NOT bypass the guard (Helm string-truthiness footgun).
          if helm template demo helm/openmrs-tenant \
              --set global.tenant.name=demo --set dbBootstrap.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
              --set openmrs-backend.db.hostname=h \
              --set openmrs-backend.db.username=openmrs_demo_user --set openmrs-backend.db.password=ci-pass \
              --set openmrs-backend.seaweedfs.enabled=true \
              --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
              --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
              --set-string openmrs-backend.seaweedfs.s3.credentials.useDefaultChain=false >/dev/null 2>&1; then
            echo "string useDefaultChain=false must not bypass the scoped-key guard"; exit 1
          fi
          # useDefaultChain=true with a static key set is contradictory and must be rejected.
          if err=$(helm template demo helm/openmrs-tenant \
              --set global.tenant.name=demo --set dbBootstrap.enabled=false \
              --set openmrs-backend.db.url=jdbc:mariadb://h:3306/openmrs_demo \
              --set openmrs-backend.db.hostname=h \
              --set openmrs-backend.db.username=openmrs_demo_user --set openmrs-backend.db.password=ci-pass \
              --set openmrs-backend.seaweedfs.enabled=true \
              --set openmrs-backend.seaweedfs.s3.endpoint=http://s3:8333 \
              --set openmrs-backend.seaweedfs.s3.bucketName=openmrs-demo \
              --set openmrs-backend.seaweedfs.s3.credentials.useDefaultChain=true \
              --set openmrs-backend.seaweedfs.s3.credentials.accessKey=k 2>&1); then
            echo "useDefaultChain=true with a static key must be rejected"; exit 1
          fi
          grep -qF 'means no static keys, but accessKey' <<<"$err"
          # ServiceAccount annotations must render under metadata (indented), not at column 0.
          helm template t helm/openmrs-backend \
            --set serviceAccount.create=true \
            --set 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::x:role/y' \
            --show-only templates/serviceaccount.yaml > /tmp/sa.yaml
          grep -qE '^  annotations:' /tmp/sa.yaml
          if grep -qE '^annotations:' /tmp/sa.yaml; then
            echo "ServiceAccount annotations must be under metadata, not top-level"; exit 1
          fi

      - name: Validate SeaweedFS filer-backed IAM (enableAuth=false + s3Seed hook)
        run: |
          # Default: gateway is filer-backed (no static -config) and the s3Seed hook renders.
          helm template helm/openmrs --generate-name \
            --set seaweedfs.enabled=true > /tmp/sw-default.yaml
          grep -q 'seaweedfs-s3-seed' /tmp/sw-default.yaml
          grep -q 'primary-admin' /tmp/sw-default.yaml
          # The primary identity must be bucket-scoped, NOT cluster-admin (else the primary can
          # read/write every tenant bucket). Assert the grant, not just the name - a name-only
          # grep passes whether the actions are Read/Write/List or Admin.
          grep -q '\-actions Read:%s,Write:%s,List:%s' /tmp/sw-default.yaml
          if grep -q '\-actions Admin' /tmp/sw-default.yaml; then
            echo "the primary identity must be bucket-scoped, not Admin"; exit 1
          fi
          if grep -q '\-config=/etc/sw' /tmp/sw-default.yaml; then
            echo "expected filer-backed gateway (no static -config) by default"; exit 1
          fi
          # Seed uses its OWN creds Secret, so it works with only the top-level
          # seaweedfs.enabled flag (backend wiring off) - no dependency on the backend
          # Secret's storage.s3.* keys.
          grep -q 'seaweedfs-s3-seed-creds' /tmp/sw-default.yaml
          # seaweedfs disabled -> no seed hook
          helm template helm/openmrs --generate-name \
            --set seaweedfs.enabled=false > /tmp/sw-off.yaml
          if grep -q 's3-seed' /tmp/sw-off.yaml; then
            echo "seed hook must not render when seaweedfs is disabled"; exit 1
          fi
          # Reverting to static -config (enableAuth=true) must NOT render the seed hook,
          # and the gateway must carry the static -config flag.
          helm template helm/openmrs --generate-name \
            --set seaweedfs.enabled=true --set seaweedfs.s3.enableAuth=true > /tmp/sw-static.yaml
          if grep -q 's3-seed' /tmp/sw-static.yaml; then
            echo "seed hook must not render when enableAuth=true"; exit 1
          fi
          grep -q '\-config=/etc/sw' /tmp/sw-static.yaml
          # Guard: filer-backed (enableAuth=false) with the seed disabled would leave the
          # gateway permanently open (no identity ever seeded) - must fail the render.
          if err=$(helm template helm/openmrs --generate-name \
              --set seaweedfs.enabled=true --set s3Seed.enabled=false 2>&1); then
            echo "expected a fail when enableAuth=false and s3Seed.enabled=false"; exit 1
          fi
          grep -qF 'permanently open to anonymous access' <<<"$err"
          # Admin key feeds the s3Seed shell: empty (dig fills only an absent key), whitespace,
          # and leading '-' must all fail.
          # Grep the message, not just the exit code: the charset guard also rejects an empty
          # key, so exit-code-only would pass even if the non-empty guard were gone.
          if err=$(helm template helm/openmrs --generate-name --set seaweedfs.enabled=true \
              --set-string openmrs-backend.seaweedfs.s3.credentials.admin.accessKey= 2>&1); then
            echo "empty admin accessKey must be rejected when s3Seed is enabled"; exit 1
          fi
          grep -qF 'must be non-empty' <<<"$err"
          if err=$(helm template helm/openmrs --generate-name --set seaweedfs.enabled=true \
              --set-string 'openmrs-backend.seaweedfs.s3.credentials.admin.secretKey=bad pass' 2>&1); then
            echo "admin secretKey with whitespace must be rejected"; exit 1
          fi
          grep -qF 'may only contain' <<<"$err"
          # Seed Job deadline defaults to 240s (raised for the cold-start race) and is overridable.
          grep -qE 'activeDeadlineSeconds: 240' /tmp/sw-default.yaml
          helm template helm/openmrs --generate-name --set seaweedfs.enabled=true \
            --set s3Seed.activeDeadlineSeconds=300 | grep -qE 'activeDeadlineSeconds: 300'


