{{- if .Values.s3Bootstrap.enabled }}
{{- $s3 := (index .Values "openmrs-backend").seaweedfs.s3 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-s3-credentials
  labels:
    {{- include "openmrs-tenant.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The backend authenticates with this same key; the s3-bootstrap Job provisions
  # the matching identity on the shared SeaweedFS.
  accessKey: {{ $s3.credentials.accessKey | quote }}
  secretKey: {{ $s3.credentials.secretKey | quote }}
{{- end }}
