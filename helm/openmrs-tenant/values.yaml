# Default values for openmrs-tenant.
# A thin chart: the backend and frontend workloads come from the shared
# openmrs-backend/openmrs-frontend charts, consumed as dependencies.
# This chart only supplies the per-tenant configuration surface on top of them.

global:
  defaultStorageClass: ""
  tenant:
    name: ""
  mariadb:
    enabled: false

# dbBootstrap provisions the tenant database/user/grants on the shared MariaDB
# via the MariaDB operator's Database/User/Grant CRs — the root password never
# leaves the operator. Disable for manual CREATE DATABASE/USER/GRANT.
dbBootstrap:
  enabled: true
  # The shared MariaDB CR to provision on (from the primary openmrs chart).
  mariaDbRef:
    name: openmrs-mariadb
    namespace: openmrs
  # Database name override; default openmrs_<tenant> (hyphens → underscores).
  # Must contain openmrs_<tenant> and be the database openmrs-backend.db.url
  # connects to — the chart rejects either at render time.
  database: ""
  # Per-tenant connection limit on the shared MariaDB.
  maxUserConnections: 20
  # DB/user fate on helm uninstall: Skip keeps them, Delete drops them (the
  # operator's own default is Delete — hence the safe Skip default).
  cleanupPolicy: Skip

# Post-install Job that provisions this tenant's bucket + a bucket-scoped identity on
# the shared SeaweedFS. Leave off when the tenant uses managed S3.
s3Bootstrap:
  enabled: false
  # Match the deployed SeaweedFS version so weed-shell commands stay compatible.
  image: "chrislusf/seaweedfs:4.31"
  # The shared SeaweedFS master the Job talks to.
  master: "openmrs-seaweedfs-master.openmrs.svc.cluster.local:9333"
  backoffLimit: 6
  # Caps the Job (weed shell blocks on an unresolvable master, so backoffLimit can't retry a
  # hang); keep under the install --timeout so a real hang fails the Job instead of helm.
  activeDeadlineSeconds: 240

openmrs-backend:
  # Off by default; set hostnames alongside enabled.
  gateway:
    enabled: false
    hostnames: []

  # A tenant shares the primary cluster's MariaDB — external DB only, no
  # bundled MariaDB.
  db:
    url: ""        # full JDBC URL to the shared MariaDB, e.g.
                   # "jdbc:mariadb:loadbalance://mariadb:3306/<tenantdb>?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true"
    # hostname/port feed the backend image's wait-for-it preflight (it gates on
    # OMRS_DB_HOSTNAME:OMRS_DB_PORT, defaulting to localhost:3306), so they must
    # point at the same shared MariaDB the JDBC URL connects to.
    hostname: ""   # e.g. <primary-release>-mariadb.<primary-namespace>.svc.cluster.local
    port: 3306
    # Must be exactly openmrs_<tenant> + "_user" (hyphens → underscores) while
    # dbBootstrap.enabled=true; the chart rejects anything else at render time.
    username: ""
    password: ""

  podLabels: {}

  # Horizontal scaling (opt-in; see README "Scaling a tenant"). A scaled tenant needs
  # clustered cache + shared object storage below, enforced by the backend's guard.
  replicaCount: 1
  infinispan:
    clustered: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  traefikService:
    sticky:
      cookie:
        # Set per tenant to avoid cross-tenant cookie collisions on the shared gateway.
        name: "openmrs_session"
  # Shares the primary's SeaweedFS with its own bucket + bucket-scoped credentials.
  # endpoint must point at the primary's S3; for managed S3 use the S3 URL,
  # forcePathStyle "false", and a real region.
  seaweedfs:
    enabled: false
    s3:
      endpoint: ""       # e.g. http://openmrs-seaweedfs-s3.openmrs.svc.cluster.local:8333
      bucketName: ""     # distinct per tenant; S3 names must be DNS-style, e.g. openmrs-<tenant> (hyphens, not underscores)
      region: "us-east-2"
      forcePathStyle: "true"
      credentials:
        # This tenant's bucket-scoped key (s3Bootstrap provisions the matching identity).
        # Required when seaweedfs.enabled - the admin fallback below is blanked.
        accessKey: ""
        secretKey: ""
        # Blanked so a tenant never falls back to the primary's shared SeaweedFS credential.
        admin:
          accessKey: ""
          secretKey: ""
        # true only for managed S3 with IRSA/instance creds: waives the key requirement, emits no keys.
        useDefaultChain: false

openmrs-frontend:
  enabled: true
  # Off by default; set hostnames alongside enabled.
  gateway:
    enabled: false
    hostnames: []

  # Per-tenant SPA configuration. spaPath drives the ConfigMap, the route
  # match, and the root-redirect target, so a per-tenant path override stays
  # consistent end to end.
  spaPath: "/openmrs/spa"
  apiUrl: "/openmrs"
  defaultLocale: "en"
  # Empty = no SPA_CONFIG_URLS config file. A tenant that needs a per-tenant
  # config file sets this.
  configUrls: ""

  replicaCount: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  podLabels: {}
