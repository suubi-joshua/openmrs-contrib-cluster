{{- if and .Values.seaweedfs.enabled .Values.seaweedfs.s3.enabled (default (dict) .Values.s3Seed).enabled (not .Values.seaweedfs.s3.enableAuth) }}
{{- /*
Credentials for the s3Seed hook, read from the SAME source the backend authenticates
with (openmrs-backend.seaweedfs.s3.credentials.admin), so the seeded identity's key
can't drift from the backend's. Reads values (not the backend Secret) so it stays
independent of the backend's own seaweedfs wiring flag.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-seaweedfs-s3-seed-creds
  labels:
    {{- include "openmrs.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ dig "seaweedfs" "s3" "credentials" "admin" "accessKey" "openmrs" (index .Values "openmrs-backend") | quote }}
  secretKey: {{ dig "seaweedfs" "s3" "credentials" "admin" "secretKey" "OpenMRS123" (index .Values "openmrs-backend") | quote }}
{{- end }}
