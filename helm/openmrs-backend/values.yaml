# Default values for openmrs-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  defaultStorageClass: "gp2"

  security:
    allowInsecureImages: true

  # Fallback for standalone rendering; a parent chart's own global.* wins over this.
  mariadb:
    enabled: false
    replicas: 2
    galera: true
    auth:
      database: openmrs
      username: openmrs
      password: OpenMRS123

replicaCount: 1

image:
  repository: openmrs/openmrs-reference-application-3-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

infinispan:
  clustered: false
  bind_port: 7800

db:
  hostname: mariadb
  port: 3306
  database: ""        # External DB name, falls back to "openmrs". Ignored when
                      # global.mariadb.enabled=true (uses global.mariadb.auth.database instead).
  url: ""             # Full JDBC URL for an external database. Requires db.hostname
                      # alongside it (the image's startup preflight gates on
                      # OMRS_DB_HOSTNAME:OMRS_DB_PORT); db.database is ignored.
                      # Ignored when global.mariadb.enabled=true.
  username: openmrs
  password: OpenMRS123

elasticsearch:
  enabled: false
  uris: ""            # When non-empty, the workload ConfigMap/Secret add hibernate
                      # search backend URIs/credentials (external search clusters).
  username: ""
  password: ""

imagePullSecrets: []

persistence:
  enabled: true
  size: 8Gi
  # whenScaled "" -> Delete under autoscaling (scale-in drops the claim), Retain
  # otherwise so a single-replica scale-to-0 keeps its data. Retain on uninstall.
  retentionPolicy:
    whenScaled: ""
    whenDeleted: Retain

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  fsGroupChangePolicy: "Always"

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1001


service:
  type: ClusterIP
  port: 8080

gateway:
  enabled: true
  hostnames: []
  path: /openmrs/
  parentRefs:
    name: traefik-gateway
    namespace: openmrs-system

traefikService:
  enabled: false
  sticky:
    cookie:
      secure: false

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "http-cookie"
    nginx.ingress.kubernetes.io/session-cookie-expires: "43200"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "43200"
  rules:
    - http:
      paths:
        - path: /openmrs/
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
     cpu: 4.0
     memory: 4Gi
  requests:
     cpu: 1000m
     memory: 2Gi

livenessProbe:
  httpGet:
    path: /openmrs/health/started
    port: 8080
  failureThreshold: 3
  timeoutSeconds: 1
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /openmrs/health/started
    port: 8080
  initialDelaySeconds: 60
  failureThreshold: 10
  timeoutSeconds: 5
  periodSeconds: 15
startupProbe:
  httpGet:
    path: /openmrs/health/started
    port: 8080
  initialDelaySeconds: 20
  failureThreshold: 120
  timeoutSeconds: 1
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  # Near node-group capacity (a pod requests 1000m/2Gi ≈ one per node), so exhaustion
  # shows as HPA ScalingLimited rather than a Pending pod.
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # Off (like the frontend): heap sizes off the limit, HPA measures the request, and
  # heap doesn't track load - a memory target stalls the HPA more than it helps.
  # targetMemoryUtilizationPercentage: 80
  # Longer scale-down window: the 300s default is short vs this backend's slow boot.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 900

# Caps how many backend pods a voluntary disruption (node drain / CA scale-in)
# may take down at once. A PDB is rendered whenever the backend can run >1
# replica. maxUnavailable (not minAvailable) so a single-replica backend can
# still be drained for node maintenance/scale-in - minAvailable:1 would pin the
# sole pod and block the drain entirely.
podDisruptionBudget:
  maxUnavailable: 1

statefulset:
  # topologyKey for the soft pod anti-affinity that spreads replicas across nodes.
  topology:
    spread: kubernetes.io/hostname

# Pod scheduling affinity. Empty {} keeps the chart's default soft pod
# anti-affinity (spread replicas across nodes, preferred not required). Set this
# to override entirely - e.g. node affinity to pin backends to a pool, or
# requiredDuringScheduling anti-affinity for hard one-per-node placement.
affinity: {}

seaweedfs:
  enabled: false
  admin:
    enabled: false
    urlPrefix: /seaweedfs-admin
    httpRoute:
      enabled: false
      parentRefs:
        name: traefik-gateway
        namespace: openmrs-system
      hostnames:
        - localhost
  # Must match the umbrella's top-level seaweedfs.s3.credentials.admin.*.
  s3:
    # Empty = this release's own in-cluster SeaweedFS; a tenant sharing the primary's
    # points here (e.g. http://openmrs-seaweedfs-s3.openmrs.svc.cluster.local:8333).
    endpoint: ""
    # Shared across releases under admin creds - tenants sharing one SeaweedFS MUST
    # each set a distinct, pre-created bucket or they overwrite each other's files.
    bucketName: "openmrs"
    credentials:
      admin:
        accessKey: "openmrs"
        secretKey: "OpenMRS123"
