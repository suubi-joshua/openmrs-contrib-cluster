{{- if include "openmrs-backend.needsSticky" . }}
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ include "openmrs-backend.fullname" . }}-sticky
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openmrs-backend.labels" . | nindent 4 }}
spec:
  weighted:
    services:
      - name: {{ include "openmrs-backend.fullname" . }}
        port: {{ .Values.service.port | default 8080 }}
        weight: 1
        sticky:
          cookie:
            name: {{ .Values.traefikService.sticky.cookie.name | default "openmrs_session" }}
            secure: {{ if kindIs "invalid" .Values.traefikService.sticky.cookie.secure }}true{{ else }}{{ .Values.traefikService.sticky.cookie.secure }}{{ end }}
            httpOnly: true
{{- end }}
