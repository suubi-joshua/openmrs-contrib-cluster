apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmrs-backend.fullname" . }}
  labels:
    {{- include "openmrs-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.global.mariadb.enabled }}
  OMRS_DB_USERNAME: {{ .Values.global.mariadb.auth.username | default "openmrs" | quote }}
  OMRS_DB_PASSWORD: {{ .Values.global.mariadb.auth.password | default "OpenMRS123" | quote }}
  {{ else }}
  OMRS_DB_USERNAME: {{ .Values.db.username | quote }}
  OMRS_DB_PASSWORD: {{ .Values.db.password | quote }}
  {{- end }}
  {{- if .Values.elasticsearch.uris }}
  hibernate.search.backend.username: {{ .Values.elasticsearch.username | quote }}
  hibernate.search.backend.password: {{ .Values.elasticsearch.password | quote }}
  {{- else if .Values.elasticsearch.enabled }}
  OMRS_EXTRA_HIBERNATE_SEARCH_BACKEND_USERNAME: "elastic"
  {{- end }}
  {{- if .Values.seaweedfs.enabled }}
  {{- /* Falls back to credentials.admin.* (the primary's own credential); both empty emits no
       static keys, so the AWS SDK default chain (e.g. IRSA) applies. */}}
  {{- $ak := .Values.seaweedfs.s3.credentials.accessKey | default .Values.seaweedfs.s3.credentials.admin.accessKey -}}
  {{- $sk := .Values.seaweedfs.s3.credentials.secretKey | default .Values.seaweedfs.s3.credentials.admin.secretKey -}}
  {{- if and $ak $sk }}
  storage.s3.accessKeyId: {{ $ak | quote }}
  storage.s3.secretAccessKey: {{ $sk | quote }}
  {{- end }}
  {{- end }}